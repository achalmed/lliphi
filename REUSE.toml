# REUSE 3.3 (Calibre 10533): qué licencia tiene cada archivo. Código MIT; activos gráficos y lo generado
# para Plasma, CC BY-SA 4.0; documentación, CC BY-SA 4.0. La última tabla que coincide gana.
version = 1
SPDX-PackageName = "lliphi"
SPDX-PackageSupplier = "Edison Achalma <https://achalmaedison.netlify.app>"
SPDX-PackageDownloadLocation = "https://github.com/achalmed/lliphi"

[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Edison Achalma"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["generado/**", "fuentes/**", "muestras/**", "docs/**", "tokens/**", "README.md", "CHANGELOG.md", "estado.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Edison Achalma"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Decoración Aurorae: deriva de WhiteSur-dark (vinceliuice) y Nothing (jomada), ambos GPL-3.0-or-later
# (fuentes/aurorae/base/ORIGEN.md); la copia de partida y lo generado desde ella heredan la licencia.
[[annotations]]
path = ["fuentes/aurorae/**", "generado/aurorae/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["vinceliuice (WhiteSur-dark)", "jomada (Nothing)", "2026 Edison Achalma (adaptación a Lliphi)"]
SPDX-License-Identifier = "GPL-3.0-or-later"

# Pantallas de carga y de salida (mejora 6): derivan de las de WhiteSur-dark (vinceliuice; timer.js de David Edmundson)
[[annotations]]
path = ["generado/look-and-feel/*/contents/splash/**", "generado/look-and-feel/*/contents/logout/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["vinceliuice (WhiteSur-dark)", "2018 David Edmundson (timer.js)", "2026 Edison Achalma (adaptación a Lliphi)"]
SPDX-License-Identifier = "GPL-3.0-or-later"
# Logout.qml, LogoutButton.qml y timer.js traen además su cabecera SPDX de KDE (GPL-2.0-or-later, compatible): se conserva

# Inicio de sesión SDDM (mejora 7): deriva del de WhiteSur-dark (vinceliuice), que deriva del de Breeze (David Edmundson);
# los QML conservan su cabecera SPDX LGPL-2.0-or-later de KDE
[[annotations]]
path = ["generado/sddm/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2014-2016 David Edmundson (Breeze)", "vinceliuice (WhiteSur-dark)", "2026 Edison Achalma (adaptación a Lliphi)"]
SPDX-License-Identifier = "GPL-3.0-or-later"
