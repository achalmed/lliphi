# Publica sitio/_site (ya renderizado y versionado) en GitHub Pages en cada push a main.
# El render es local (`quarto render sitio`), como en el hub del autor; aquí no se construye nada.
name: sitio
on:
  push:
    branches: [main]
    paths: ["sitio/_site/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio/_site
      - id: deploy
        uses: actions/deploy-pages@v4
